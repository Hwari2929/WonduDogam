# 디자인을 실제 웹에서 보기 위한 정적 미리보기 배포.
#
# 서버가 필요한 진짜 배포는 .openai/hosting.json 이 가리키는 곳이 맡습니다.
# 여기서 굽는 것은 화면만 확인하기 위한 클라이언트 번들이라, 카카오맵 SDK 키가
# 없어도 앱이 스스로 그리는 지도로 그대로 돕니다.
name: 정적 미리보기 배포

on:
  push:
    branches:
      - main
      - claude/design-system-improvements-4tkhud
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연달아 밀어 넣어도 마지막 것이 올라갑니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 화면이 깨진 채로 올라가지 않게, 굽기 전에 앱의 검증을 먼저 통과시킵니다.
      - run: pnpm lint
      - run: pnpm test

      - name: 정적 미리보기 굽기
        # 프로젝트 페이지는 /<저장소이름>/ 아래에 섭니다.
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}/
        run: pnpm exec vite build --config vite.preview.config.ts

      - name: 깊은 링크와 Jekyll 우회 준비
        # /c/{id} 로 새로고침해도 같은 앱이 뜨도록 404 를 index 로 둡니다.
        # .nojekyll 이 없으면 _ 로 시작하는 파일이 통째로 사라집니다.
        run: |
          cp dist-preview/index.html dist-preview/404.html
          touch dist-preview/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
